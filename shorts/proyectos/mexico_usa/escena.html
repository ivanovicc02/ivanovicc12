<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #vig { background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(25,10,8,.45) 100%); }
  #grain { opacity: .06; mix-blend-mode: overlay; }
  #flash { background: #fff6e0; opacity: 0; }
  #black { background: #0c0a0a; opacity: 0; }
  #cap { position: absolute; left: 70px; right: 70px; top: 300px; text-align: center; color: rgba(255,255,255,.6);
    font: 600 66px 'Inter', sans-serif; line-height: 1.25; text-shadow: 0 2px 14px rgba(0,0,0,.5); }
  #cap .w { display: inline-block; margin: 0 8px; position: relative; }
  #cap .now { color: #fff; font-weight: 800; }
  #cap .key { color: #fff; font-weight: 800; }
  #cap .key::before { content: ''; position: absolute; left: -10px; right: -10px; top: 0; bottom: -4px; border: 4px solid #5b8cff; background: rgba(40,70,170,.35); border-radius: 4px; z-index: -1; }
  #cap .key::after { content: ''; position: absolute; right: -18px; bottom: -12px; width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 3px solid #5b8cff; }
  #hud { position: absolute; left: 0; right: 0; top: 560px; text-align: center; color: #fff; opacity: 0; text-shadow: 0 2px 16px rgba(0,0,0,.6); }
  #hud .lab { font: 700 28px 'Inter', sans-serif; letter-spacing: 5px; text-transform: uppercase; }
  #hud .num { font: 800 110px 'Inter', sans-serif; line-height: 1.05; }
  #hud .sub { font: 600 24px 'Inter', sans-serif; letter-spacing: 4px; text-transform: uppercase; opacity: .85; }
  #mapbox { position: absolute; left: 40px; right: 40px; top: 520px; opacity: 0; border-radius: 30px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); border: 6px solid #f4efe4; }
  #mapbox svg { display: block; width: 100%; height: auto; }
  #cta { position: absolute; left: 0; right: 0; top: 420px; text-align: center; opacity: 0; }
  .q { font: 800 68px 'Inter', sans-serif; color: #fff; text-shadow: 0 3px 18px rgba(0,0,0,.6); line-height: 1.15; }
  .opts { display: flex; justify-content: center; gap: 28px; margin-top: 36px; }
  .opt { font: 900 46px 'Inter', sans-serif; color: #fff; padding: 20px 44px; border-radius: 60px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .o1 { background: #2f8f4e; } .o2 { background: #c62f2f; }
  #end { position: absolute; left: 60px; right: 60px; top: 700px; text-align: center; opacity: 0; color: #f2efe8; }
  #end .c { font: 700 30px 'Inter', sans-serif; letter-spacing: 3px; margin-top: 40px; color: #ffe08a; }
</style>
</head>
<body>
<div id="root">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="vig" class="layer"></div>
  <div id="grain" class="layer"></div>
  <div id="mapbox"><svg id="mapa" viewBox="0 0 1100 660"></svg></div>
  <div id="hud"><div class="lab"></div><div class="num"></div><div class="sub"></div></div>
  <div id="cta"><div class="q">¿Ganar en dólares<br>o defender a México?</div><div class="opts"><div class="opt o1">💵 DÓLARES</div><div class="opt o2">🇲🇽 MÉXICO</div></div></div>
  <div id="cap"></div>
  <div id="flash" class="layer"></div>
  <div id="black" class="layer"></div>
  <div id="end"><div class="q">¿Ganar en dólares<br>o defender a México?</div><div class="opts"><div class="opt o1">💵 DÓLARES</div><div class="opt o2">🇲🇽 MÉXICO</div></div><div class="c">TE LEO EN LOS COMENTARIOS ↓</div></div>
</div>
<script src="../../engine3d/node_modules/three/build/three.min.js"></script>
<script src="../../engine3d/personaje.js"></script>
<script src="../../engine3d/texturas.js"></script>
<script src="mexico.js"></script>
</body>
</html>
