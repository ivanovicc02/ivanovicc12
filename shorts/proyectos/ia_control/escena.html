<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #redv { background: radial-gradient(ellipse at center, rgba(255,0,0,0) 55%, rgba(200,0,20,.55) 100%); opacity: 0; mix-blend-mode: screen; }
  #vig { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
  #grain { opacity: .07; mix-blend-mode: overlay; background-repeat: repeat; }
  #glitch { opacity: 0; background: repeating-linear-gradient(0deg, rgba(255,40,40,.25) 0 6px, rgba(0,0,0,0) 6px 22px, rgba(60,170,255,.2) 22px 26px, rgba(0,0,0,0) 26px 60px); mix-blend-mode: screen; }
  #flash { background: #fff; opacity: 0; }
  #black { background: #08090d; opacity: 0; }
  #hud { position: absolute; left: 66px; top: 300px; color: #fff; opacity: 0; text-shadow: 0 2px 14px rgba(0,0,0,.6), 0 0 2px rgba(0,0,0,.4); }
  #hud .lab { font: 600 25px 'Inter', sans-serif; letter-spacing: 5px; text-transform: uppercase; opacity: .92; }
  #hud .num { font: 400 96px 'Caladea', 'Liberation Serif', serif; line-height: 1.02; margin-top: 2px; white-space: nowrap; }
  #hud .sub { font: 500 18px 'Inter', sans-serif; letter-spacing: 4px; text-transform: uppercase; opacity: .85; margin-top: 8px; }
  #bubble { position: absolute; left: 120px; top: 150px; opacity: 0; background: #12060a; color: #ff4a4a; border: 4px solid #ff3030; border-radius: 40px;
    font: 800 64px 'Inter', sans-serif; padding: 30px 44px; box-shadow: 0 0 40px rgba(255,40,40,.5); }
  #bubble::after { content: ''; position: absolute; left: 70px; bottom: -42px; border: 22px solid transparent; border-top: 22px solid #ff3030; }
  #phone { position: absolute; left: 50%; top: 360px; margin-left: -230px; width: 460px; height: 780px; border-radius: 60px; background: #0a0b10; border: 10px solid #222;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(255,40,40,.35); opacity: 0; display: flex; align-items: center; justify-content: center; }
  #phone .msg { color: #ff4a4a; font: 900 52px 'Inter', sans-serif; text-align: center; line-height: 1.25; text-shadow: 0 0 20px rgba(255,40,40,.6); }
  #cap { position: absolute; left: 60px; right: 60px; top: 1260px; text-align: center; color: #fff;
    font: italic 400 60px 'Caladea', 'Liberation Serif', serif; line-height: 1.2; opacity: 0; text-shadow: 0 2px 16px rgba(0,0,0,.7), 0 0 3px rgba(0,0,0,.5); }
  #cap b { font-weight: 700; color: #ff6a6a; }
  #cta { position: absolute; left: 0; right: 0; top: 300px; text-align: center; opacity: 0; }
  .q { font: 400 70px 'Caladea', serif; color: #fff; text-shadow: 0 3px 18px rgba(0,0,0,.6); line-height: 1.15; }
  .opts { display: flex; justify-content: center; gap: 24px; margin-top: 34px; }
  .opt { font: 800 40px 'Inter', sans-serif; color: #fff; padding: 18px 34px; border-radius: 60px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .o1 { background: #d0303a; } .o2 { background: #2f6fd1; }
  #end { position: absolute; left: 60px; right: 60px; top: 680px; text-align: center; opacity: 0; color: #f2efe8; }
  #end .c { font: 600 30px 'Inter', sans-serif; letter-spacing: 3px; margin-top: 40px; color: #ffe08a; }
</style>
</head>
<body>
<div id="root">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="redv" class="layer"></div>
  <div id="vig" class="layer"></div>
  <div id="grain" class="layer"></div>
  <div id="glitch" class="layer"></div>
  <div id="hud"><div class="lab"></div><div class="num"></div><div class="sub"></div></div>
  <div id="bubble">"No. Hoy no<br>vas a salir."</div>
  <div id="phone"><div class="msg"></div></div>
  <div id="cta"><div class="q">¿Apagas el mundo<br>o te dejas controlar?</div>
    <div class="opts"><div class="opt o1">APAGO TODO</div><div class="opt o2">ME DEJO CONTROLAR</div></div></div>
  <div id="cap"></div>
  <div id="flash" class="layer"></div>
  <div id="black" class="layer"></div>
  <div id="end">
    <div class="q">¿Apagas el mundo<br>o te dejas controlar?</div>
    <div class="opts"><div class="opt o1">APAGO TODO</div><div class="opt o2">ME DEJO CONTROLAR</div></div>
    <div class="c">TE LEO EN LOS COMENTARIOS ↓</div>
  </div>
</div>
<script src="../../engine3d/node_modules/three/build/three.min.js"></script>
<script src="../../engine3d/personaje.js"></script>
<script src="../../engine3d/texturas.js"></script>
<script src="ia.js"></script>
</body>
</html>
