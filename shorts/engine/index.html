<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #captions {
    position: absolute; left: 70px; right: 70px; top: 250px;
    text-align: center; font-family: 'Inter', 'DejaVu Sans', sans-serif;
    font-weight: 800; font-size: 66px; line-height: 1.22; color: #fff;
    text-shadow: 0 3px 10px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.6);
    letter-spacing: -0.5px;
  }
  .w { display: inline-block; margin: 0 6px; position: relative; transition: none; }
  .w.past { color: rgba(255,255,255,.42); font-weight: 600; }
  .w.now  { color: #fff; }
  .w.hl::before {
    content: ''; position: absolute; left: -8px; right: -8px; top: 2px; bottom: 0px;
    border: 4px solid #5b7cff; border-radius: 4px; background: rgba(40,60,160,.28);
  }
  .w.hl .dot { position: absolute; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; border: 3px solid #5b7cff; box-sizing: border-box; }
  .w.hl .d1 { left: -14px; top: -4px; } .w.hl .d2 { right: -14px; bottom: -6px; }
  .w.hl .t { position: relative; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="root">
  <svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="captions"></div>
  <div id="flash"></div>
</div>
<script src="core.js"></script>
<script src="assets.js"></script>
</body>
</html>
