<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #captions {
    position: absolute; left: 70px; right: 70px; top: 250px;
    text-align: center; font-family: 'Inter', 'DejaVu Sans', sans-serif;
    font-weight: 800; font-size: 66px; line-height: 1.22; color: #fff;
    text-shadow: 0 3px 12px rgba(0,0,0,.75), 0 0 3px rgba(0,0,0,.9), 0 0 1px #000;
    letter-spacing: -0.5px;
  }
  .w { display: inline-block; margin: 0 6px; position: relative; transition: none; }
  .w.past { color: rgba(255,255,255,.9); font-weight: 700; }
  .w.now  { color: #ffd84a; }
  .w.hl::before {
    content: ''; position: absolute; left: -8px; right: -8px; top: 2px; bottom: 0px;
    border: 4px solid #5b7cff; border-radius: 4px; background: rgba(40,60,160,.28);
  }
  .w.hl .dot { position: absolute; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; border: 3px solid #5b7cff; box-sizing: border-box; }
  .w.hl .d1 { left: -14px; top: -4px; } .w.hl .d2 { right: -14px; bottom: -6px; }
  .w.hl .t { position: relative; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #overlay { position: absolute; inset: 0; z-index: 4; font-family: 'Inter', 'DejaVu Sans', sans-serif; }
  .ov { position: absolute; left: 50%; transform-origin: center; }
  .badge { background: rgba(16,16,22,.85); color: #ffe7b0; font-weight: 800; font-size: 100px;
    padding: 6px 44px 10px; border-radius: 40px; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .badge small { font-size: 46px; margin-left: 8px; }
  .card { width: 760px; margin-left: -380px; display: flex; align-items: center; gap: 28px;
    background: rgba(255,255,255,.95); color: #18181f; font-weight: 800; font-size: 58px;
    padding: 22px 34px; border-radius: 34px; box-shadow: 0 14px 34px rgba(0,0,0,.35); box-sizing: border-box; }
  .card .n { width: 84px; height: 84px; border-radius: 50%; background: #5b7cff; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 52px; flex: none; }
  .card.bad { background: rgba(255,235,235,.95); text-decoration: line-through; text-decoration-color: #e5484d; text-decoration-thickness: 8px; }
  .card.bad .n { background: #e5484d; }
  .card.good .n { background: #2bb673; }
  .mark { width: 230px; height: 230px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; box-shadow: 0 14px 40px rgba(0,0,0,.4); }
  .mark.ok { background: #2bb673; } .mark.no { background: #e5484d; }
  .mark svg { width: 130px; height: 130px; }
  .pill { font-weight: 900; font-size: 120px; color: #fff; padding: 10px 70px; border-radius: 80px;
    box-shadow: 0 14px 40px rgba(0,0,0,.4); }
  .pill.si { background: #2bb673; } .pill.no { background: #e5484d; }
  .bubble { width: 250px; height: 200px; margin-left: -125px; background: #fff; border-radius: 60px;
    display: flex; align-items: center; justify-content: center; gap: 22px; box-shadow: 0 14px 40px rgba(0,0,0,.4); }
  .bubble::after { content: ''; position: absolute; left: 50px; bottom: -40px; border: 30px solid transparent;
    border-top: 40px solid #fff; border-left: 10px solid #fff; }
  .bubble i { width: 34px; height: 34px; border-radius: 50%; background: #5b7cff; display: block; }
  .tag { background: #fff; color: #18181f; font-weight: 900; font-size: 64px; padding: 14px 40px;
    border-radius: 24px; letter-spacing: 2px; box-shadow: 0 14px 40px rgba(0,0,0,.35); white-space: nowrap; }
  .tag.warn { background: #ffcf3d; }

  .w1 { display: inline-block; font-weight: 900; font-size: 96px; color: #fff; letter-spacing: -1px;
    -webkit-text-stroke: 16px #15111f; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(0,0,0,.35); }
  .w1.hl1 { color: #ffd84a; }
  .bignum { font-family: Inter, sans-serif; font-weight: 900; font-size: 210px; line-height: 1; color: #ffd84a; text-align: center;
    -webkit-text-stroke: 22px #241a08; paint-order: stroke fill; text-shadow: 0 14px 0 #8a5a10, 0 22px 30px rgba(0,0,0,.4); white-space: nowrap; }
  .bignum .bnl { font-size: 62px; color: #fff; -webkit-text-stroke: 12px #15111f; text-shadow: 0 6px 0 rgba(0,0,0,.35); margin-top: 18px; }
</style>
</head>
<body>
<div id="root">
  <svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="overlay" style="position:absolute;inset:0;z-index:4;font-family:Inter,sans-serif"></div>
  <div id="captions" style="z-index:5"></div>
  <div id="flash"></div>
</div>
<script src="core.js"></script>
<script src="assets.js"></script>
<script src="assets2.js"></script>
<script src="assets3.js"></script>
<script src="assets4.js"></script>
<script src="assets5.js"></script>
<script src="assets6.js"></script>
<script src="assets7.js"></script>
<script src="assets8.js"></script>
<script src="assets9.js"></script>
<script src="assets10.js"></script>
</body>
</html>
